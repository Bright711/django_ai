{% extends "base.html" %}
{% block title %}{{ article.title }}{% endblock %}
{% block content %}
<article><header class="article-header"><p class="eyebrow red">{{ article.category }}</p><h1>{{ article.title }}</h1><p>{{ article.published_at|date:"j F Y" }}</p></header><div class="article-hero"><img src="{% if article.image %}{{ article.image.url }}{% elif article.image_url %}{{ article.image_url }}{% else %}https://images.unsplash.com/photo-1522778119026-d647f0596c20?auto=format&fit=crop&w=1600&q=85{% endif %}" alt="{{ article.title }}"></div><div class="article-body"><p class="article-summary">{{ article.summary }}</p>{{ article.content|linebreaks }}</div></article>
{% endblock %}
